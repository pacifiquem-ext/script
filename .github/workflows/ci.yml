name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: script
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/script
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/script
      JWT_SECRET: test-jwt-secret-with-at-least-32-chars!!
      STORAGE_DRIVER: uploadthing
      UPLOADTHING_TOKEN: test-token
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @script/shared build
      - run: pnpm --filter @script/server exec prisma migrate deploy
      - run: pnpm --filter @script/server exec prisma generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @script/server exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
